*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
button{border:0;border-radius:9px;padding:11px 15px;font-weight:bold;cursor:pointer}
.primary{background:#1687d9;color:white}
.secondary{background:#e8f2fa;color:#176ca8}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:#101827;color:white;padding:20px 12px}
.logo{font-size:24px;font-weight:bold;padding:10px;margin-bottom:25px}
.logo span{color:#29a9ed}
.menu button{display:block;width:100%;background:none;color:#bfc9d8;text-align:left;margin:5px 0}
.menu button:hover,.menu button.active{background:#1d2a40;color:white}
.main{margin-left:230px;padding:25px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.header h1{margin:0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card,.box{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:18px}
.number{font-size:27px;font-weight:bold;margin-top:8px}
.muted{color:#748197;font-size:13px}
table{width:100%;background:white;border-collapse:collapse;border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:14px;border-bottom:1px solid #edf0f4}
th{font-size:12px;color:#748197}
.status{background:#e7f7ee;color:#19834b;border-radius:20px;padding:5px 9px;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f4}
.modal-bg{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}
.modal{background:white;border-radius:15px;padding:22px;width:min(500px,100%)}
.modal input,.modal select{width:100%;padding:11px;margin:6px 0 13px;border:1px solid #ccd6e2;border-radius:8px}
.modal-actions{text-align:right;margin-top:10px}
@media(max-width:700px){
.sidebar{width:65px;padding:12px 6px}
.logo{font-size:0;text-align:center}
.logo:first-letter{font-size:25px}
.menu button{font-size:0;text-align:center;padding:13px}
.menu button:first-letter{font-size:20px}
.main{margin-left:65px;padding:15px}
.cards{grid-template-columns:repeat(2,1fr)}
.header h1{font-size:22px}
table{font-size:13px}
}

async function serviciosPage() {

    document.getElementById("app").innerHTML =
        encabezado(
            "Servicios y precios",
            `<button class="primary" onclick="nuevoServicio()">+ Nuevo servicio</button>`

        </div>`;

    const { data, error } = await supabaseClient
        .from("services")
        .select("*")
        .order("name");

    if (error) {
        console.error(error);

        document.getElementById("app").innerHTML =
            encabezado("Servicios y precios") +
            `<div class="box">
                <b>No se pudieron cargar los servicios.</b>

        return;
    }

    document.getElementById("app").innerHTML =
        encabezado(

        ) +
        `
        <div class="box">
        <table>
        <thead>
            <tr>
                <th>Servicio</th>
                <th>Precio</th>
                <th>Duración</th>
                <th>Estado</th>
                <th></th>
            </tr>
        </thead>

        <tbody>
        ${data.map(s => `
            <tr>
                <td>
                    <b>${s.name}</b>
                    <div class="muted">${s.description || ""}</div>
                </td>

                <td><b>${dinero(Number(s.price))}</b></td>

                <td>${s.duration_minutes || 0} min</td>

                <td>
                    <span class="status">
                        ${s.active ? "Activo" : "Inactivo"}
                    </span>
                </td>

                <td>
                    <button
                        class="secondary"
                        onclick="editarServicio(
                            '${s.id}',
                            '${escaparTexto(s.name)}',
                            '${escaparTexto(s.description || "")}',
                            ${Number(s.price)},
                            ${Number(s.duration_minutes || 0)},
                            ${s.active}
                        )">
                        Editar
                    </button>
                </td>
            </tr>
        `).join("")}
        </tbody>

        </table>
        </div>
        `;
}


function escaparTexto(texto) {
    return String(texto)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}


function nuevoServicio() {

    modal(`
        <h2>Nuevo servicio</h2>

        <label>Nombre</label>
        <input id="servicioNombre" placeholder="Ej. Lavado premium">

        <label>Descripción</label>
        <input id="servicioDescripcion" placeholder="Ej. Exterior + interior">

        <label>Precio</label>
        <input id="servicioPrecio" type="number" min="0" placeholder="Ej. 15000">

        <label>Duración aproximada (minutos)</label>
        <input id="servicioDuracion" type="number" min="0" value="60">

        <div class="modal-actions">
            <button class="secondary" onclick="cerrarModal()">Cancelar</button>
            <button class="primary" onclick="guardarServicio()">Guardar</button>
        </div>
    `);
}


async function guardarServicio() {

    const nombre =
        document.getElementById("servicioNombre").value.trim();

    const descripcion =
        document.getElementById("servicioDescripcion").value.trim();

    const precio =
        Number(document.getElementById("servicioPrecio").value);

    const duracion =
        Number(document.getElementById("servicioDuracion").value);

    if (!nombre) {
        alert("Ingresá el nombre del servicio.");
        return;
    }

    if (precio < 0) {
        alert("Ingresá un precio válido.");
        return;
    }

    const { error } = await supabaseClient
        .from("services")
        .insert({
            name: nombre,
            description: descripcion,
            price: precio,
            duration_minutes: duracion,
            active: true
        });

    if (error) {
        console.error(error);
        alert("No se pudo guardar: " + error.message);
        return;
    }

    cerrarModal();
    serviciosPage();
}


function editarServicio(id, nombre, descripcion, precio, duracion, activo) {

    modal(`
        <h2>Editar servicio</h2>

        <label>Nombre</label>
        <input id="editServicioNombre" value="${nombre}">

        <label>Descripción</label>
        <input id="editServicioDescripcion" value="${descripcion}">

        <label>Precio</label>
        <input id="editServicioPrecio" type="number" min="0" value="${precio}">

        <label>Duración aproximada (minutos)</label>
        <input id="editServicioDuracion" type="number" min="0" value="${duracion}">

        <label>Estado</label>
        <select id="editServicioActivo">
            <option value="true" ${activo ? "selected" : ""}>Activo</option>
            <option value="false" ${!activo ? "selected" : ""}>Inactivo</option>
        </select>

        <div class="modal-actions">
            <button class="secondary" onclick="cerrarModal()">Cancelar</button>

            <button
                class="primary"
                onclick="actualizarServicio('${id}')">
                Guardar cambios
            </button>
        </div>
    `);
}


async function actualizarServicio(id) {

    const cambios = {
        name: document.getElementById("editServicioNombre").value.trim(),
        description: document.getElementById("editServicioDescripcion").value.trim(),
        price: Number(document.getElementById("editServicioPrecio").value),
        duration_minutes: Number(document.getElementById("editServicioDuracion").value),
        active: document.getElementById("editServicioActivo").value === "true"
    };

    if (!cambios.name) {
        alert("Ingresá el nombre del servicio.");
        return;
    }

    const { error } = await supabaseClient
        .from("services")
        .update(cambios)
        .eq("id", id);

    if (error) {
        console.error(error);
        alert("No se pudo actualizar: " + error.message);
        return;
    }

    cerrarModal();
    serviciosPage();
}

async function verCliente(id){

    const { data: cliente, error } = await supabaseClient
        .from("clients")
        .select(`
            id,
            name,
            phone,
            email,
            notes,
            vehicles(
                id,
                brand,
                model,
                plate,
                color
            )
        `)
        .eq("id", id)
        .single();

    if(error){
        alert("No se pudo abrir el cliente: " + error.message);
        return;
    }

    modal(`
        <h2>${cliente.name}</h2>

        <p>
            <b>WhatsApp:</b>
            ${cliente.phone || "Sin teléfono"}
        </p>

        <p>
            <b>Email:</b>
            ${cliente.email || "Sin email"}
        </p>

        <p>
            <b>Vehículos:</b>
            ${cliente.vehicles ? cliente.vehicles.length : 0}
        </p>

        ${cliente.vehicles && cliente.vehicles.length ? `
            <hr>

            ${cliente.vehicles.map(v => `
                <p>
                    🚗 <b>${v.brand || ""} ${v.model || ""}</b><br>
                    <span class="muted">
                        ${v.plate || "Sin patente"}
                    </span>
                </p>
            `).join("")}
        ` : `
            <p class="muted">
                Este cliente todavía no tiene vehículos.
            </p>
        `}

        <div class="modal-actions">
            <button
                class="secondary"
                onclick="cerrarModal()">
                Cerrar
            </button>
        </div>
    `);
}

// LOGIN AQUAPRO
// ==========================================

async function iniciarSesion() {

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const error = document.getElementById("loginError");

    error.textContent = "";

    if (!email || !password) {
        error.textContent = "Ingresá tu email y contraseña.";
        return;
    }

    const { data, error: loginError } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (loginError) {
        console.error(loginError);
        error.textContent = "Email o contraseña incorrectos.";
        return;
    }

    document.getElementById("loginScreen").style.display = "none";

    inicio();
}


async function comprobarSesion() {

    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
        document.getElementById("loginScreen").style.display = "none";
    } else {
        document.getElementById("loginScreen").style.display = "flex";
    }
}


async function cerrarSesion() {

    await supabaseClient.auth.signOut();

    document.getElementById("loginScreen").style.display = "flex";

    document.getElementById("loginPassword").value = "";
}


// ==========================================
// RECUPERACION DE CONTRASEÑA
// ==========================================

supabaseClient.auth.onAuthStateChange((event, session) => {

    if (event === "PASSWORD_RECOVERY") {

        document.getElementById("loginScreen").style.display = "none";

        document.getElementById("recoveryScreen").style.display = "flex";
    }

});


async function guardarNuevaPassword() {

    const password =
        document.getElementById("newPassword").value;

    const repeat =
        document.getElementById("repeatPassword").value;

    const mensaje =
        document.getElementById("recoveryMessage");

    if (password.length < 8) {
        mensaje.style.color = "#c62828";
        mensaje.textContent =
            "La contraseña debe tener al menos 8 caracteres.";
        return;
    }

    if (password !== repeat) {
        mensaje.style.color = "#c62828";
        mensaje.textContent =
            "Las contraseñas no coinciden.";
        return;
    }

    const { error } =
        await supabaseClient.auth.updateUser({
            password: password
        });

    if (error) {
        console.error(error);
        mensaje.style.color = "#c62828";
        mensaje.textContent =
            "No se pudo cambiar la contraseña: " + error.message;
        return;
    }

    mensaje.style.color = "#19834b";
    mensaje.textContent =
        "Contraseña actualizada correctamente.";

    await supabaseClient.auth.signOut();

    setTimeout(() => {

        document.getElementById("recoveryScreen").style.display = "none";

        document.getElementById("loginScreen").style.display = "flex";

        document.getElementById("loginPassword").value = "";

    }, 1500);
}// Comprobar si ya existe una sesión al abrir AquaPro
comprobarSesion();
